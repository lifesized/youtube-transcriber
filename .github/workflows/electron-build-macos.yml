          APP_PATH="$ROOT/dist-electron/mac-arm64/Transcriber.app/Contents/MacOS/Transcriber"
          MIGRATIONS="$ROOT/dist-electron/mac-arm64/Transcriber.app/Contents/Resources/standalone/prisma/migrations"
          PORT=$(node -p "require('./electron/config.js').port")
          TOKEN="$(openssl rand -hex 32)"
          APP_PID=""

          # Earlier steps' packaged servers can outlive their parents and keep the port.
          free_port() {
            local pids=""
            for i in $(seq 1 10); do
              pids=$(lsof -ti "tcp:${PORT}" -sTCP:LISTEN 2>/dev/null || true)
              [ -z "$pids" ] && return 0
              echo "port ${PORT} still held by: $(ps -o pid=,args= -p "$(printf '%s' "$pids" | tr '\n' ',')" | cut -c1-160)"
              while read -r pid; do
                [ -n "$pid" ] || continue
                if [ "$i" -lt 5 ]; then kill "$pid" 2>/dev/null || true; else kill -9 "$pid" 2>/dev/null || true; fi
              done <<< "$pids"
              sleep 1
            done
            echo "ERROR: port ${PORT} is still in use"; exit 1
          }

          stop_app() {
            if [ -n "$APP_PID" ]; then
              kill "$APP_PID" 2>/dev/null || true
              sleep 1
              kill -9 "$APP_PID" 2>/dev/null || true
              wait "$APP_PID" 2>/dev/null || true
              APP_PID=""
            fi
            free_port
          }
          trap stop_app EXIT

          state_dir() {
            HOME="$1" node -p "require('./electron/config.js').resolveAppStateDir()"
          }

          # Launch the real app on HOME=$1, read Settings/ProviderConfig/DailyUsage through the API, quit.
          launch_and_read_settings() {
            local home="$1" log="$1/app.log" code=""
            free_port
            HOME="$home" TRANSCRIBER_LOCAL_TOKEN="$TOKEN" "$APP_PATH" > "$log" 2>&1 &
            APP_PID=$!
            for i in $(seq 1 60); do
              if ! kill -0 "$APP_PID" 2>/dev/null; then
                echo "ERROR: Transcriber.app exited early"; cat "$log"; exit 1
              fi
              code=$(curl -sS -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${TOKEN}" \
                "http://127.0.0.1:${PORT}/api/health" 2>/dev/null || true)
              [ "$code" = "200" ] && break
              if [ "$i" -eq 60 ]; then
                echo "ERROR: app did not become healthy (http=${code:-curl-fail})"; cat "$log"; exit 1
              fi
              sleep 1
            done
            for route in /api/settings /api/settings/providers /api/usage; do
              code=$(curl -sS -o /tmp/settings-route.json -w "%{http_code}" \
                -H "Authorization: Bearer ${TOKEN}" "http://127.0.0.1:${PORT}${route}")
              echo "GET $route -> $code $(head -c 200 /tmp/settings-route.json)"
              if [ "$code" != "200" ]; then
                echo "ERROR: GET $route returned $code"; cat "$log"; exit 1
              fi
            done
            stop_app
            if grep -E "no such table|\[secrets\] Migration failed" "$log"; then
              echo "ERROR: packaged server logged a missing-table error"; exit 1
            fi
            echo "✓ settings, providers and usage routes return 200 with no missing-table errors"
          }

          assert_schema() {
            local db="$1"
            for table in Setting ProviderConfig DailyUsage WaitlistSignup Video _prisma_migrations; do
              if [ "$(sqlite3 "$db" "SELECT count(*) FROM sqlite_master WHERE type='table' AND name='$table'")" != "1" ]; then
                echo "ERROR: table $table missing from $db"; sqlite3 "$db" .schema; exit 1
              fi
            done
            for index in DailyUsage_date_provider_key WaitlistSignup_email_key Video_videoId_captionLanguage_pipelineVersion_key; do
              if [ "$(sqlite3 "$db" "SELECT count(*) FROM sqlite_master WHERE type='index' AND name='$index'")" != "1" ]; then
                echo "ERROR: index $index missing from $db"; sqlite3 "$db" .schema; exit 1
              fi
            done
            echo "✓ every schema table and unique index exists in $db"
          }

          echo "----- first launch on an empty HOME -----"
          FRESH="$(mktemp -d /tmp/transcriber-db-fresh-XXXXXX)"
          launch_and_read_settings "$FRESH"
          assert_schema "$(state_dir "$FRESH")/transcriber.db"

          echo "----- next launch heals a library from the old bootstrap -----"
          OLD="$(mktemp -d /tmp/transcriber-db-old-XXXXXX)"
          OLD_DB="$(state_dir "$OLD")/transcriber.db"
          mkdir -p "$(dirname "$OLD_DB")"
          sqlite3 "$OLD_DB" < "$MIGRATIONS/20260212021540_init/migration.sql"
          sqlite3 "$OLD_DB" < "$MIGRATIONS/20261007210826_add_transcript_cache_keys/migration.sql"
          sqlite3 "$OLD_DB" <<'SQL'
          CREATE TABLE _prisma_migrations (id TEXT PRIMARY KEY NOT NULL, checksum TEXT NOT NULL, finished_at DATETIME, migration_name TEXT NOT NULL, logs TEXT, rolled_back_at DATETIME, started_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP, applied_steps_count INTEGER NOT NULL DEFAULT 0);
          INSERT INTO _prisma_migrations (id, checksum, finished_at, migration_name, applied_steps_count) VALUES
            ('ci-1', 'ci', CURRENT_TIMESTAMP, '20260212021540_init', 1),
            ('ci-2', 'ci', CURRENT_TIMESTAMP, '20261007210826_add_transcript_cache_keys', 1);
          INSERT INTO Video (id, videoId, title, author, videoUrl, transcript, updatedAt)
            VALUES ('old-row', 'oldvid', 'Old library row', 'CI', 'https://www.youtube.com/watch?v=oldvid', '[{"text":"kept"}]', CURRENT_TIMESTAMP);
          SQL
          if [ "$(sqlite3 "$OLD_DB" "SELECT count(*) FROM sqlite_master WHERE name='Setting'")" != "0" ]; then
            echo "ERROR: seeded library should not have Setting yet"; exit 1
          fi
          launch_and_read_settings "$OLD"
          assert_schema "$OLD_DB"
          if [ "$(sqlite3 "$OLD_DB" "SELECT title FROM Video WHERE id='old-row'")" != "Old library row" ]; then
            echo "ERROR: the existing Video row did not survive the upgrade"; exit 1
          fi
          sqlite3 "$OLD_DB" "SELECT migration_name FROM _prisma_migrations ORDER BY migration_name"
          echo "✓ old-bootstrap library healed on next launch and kept its rows"

      # Design review: the real tray menu (best effort, needs the runner's
      # menu bar) and every Settings › Library state rendered by popup.js.
      - name: Capture tray menu screenshot
        timeout-minutes: 3
        continue-on-error: true
        run: |
          mkdir -p dist-electron/screenshots
          scripts/screenshot-tray-menu.sh \
            "$PWD/dist-electron/mac-arm64/Transcriber.app" \
            "$PWD/dist-electron/screenshots/tray-menu.png" \
            "$(node -p "require('./electron/config.js').port")"

      - name: Capture Settings › Library rows
        timeout-minutes: 3
        run: npx electron scripts/capture-library-rows.js dist-electron/screenshots

      - name: Upload Design screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: design-screenshots
          path: |
            dist-electron/screenshots/
            dist-electron/dmg-window.png
            dist-electron/signed/dmg-window.png
          if-no-files-found: warn
          retention-days: 14

      - name: Report packaged size
        run: |
          set -euo pipefail
          APP="$PWD/dist-electron/mac-arm64/Transcriber.app"
          DMG=$(find dist-electron -maxdepth 1 -name '*.dmg' -print | head -1)
          echo "===== packaged size ====="
          echo "App:"
          du -sh "$APP"
          echo "Resources:"
          du -sh "$APP/Contents/Resources"/* | sort -hr
          echo "standalone:"
          du -sh "$APP/Contents/Resources/standalone"/* 2>/dev/null | sort -hr
          echo "standalone/node_modules:"
          du -sh "$APP/Contents/Resources/standalone/node_modules"/* 2>/dev/null | sort -hr
          echo "Electron locales:"
          du -sh "$APP/Contents/Frameworks/Electron Framework.framework/Resources"/*.lproj 2>/dev/null | sort -hr || true
          echo "asar:"
          du -sh "$APP/Contents/Resources/app.asar" "$APP/Contents/Resources/app.asar.unpacked" 2>/dev/null || true
          echo "DMG:"
          ls -lh "$DMG"
          node scripts/assert-packaged-size.js "$APP" "$DMG"

      - name: DMG sha256
        run: |
          set -euo pipefail
          DMG=$(find dist-electron -maxdepth 1 -name '*.dmg' -print | head -1)
          HASH=$(shasum -a 256 "$DMG" | awk '{print $1}')
          echo "DMG $DMG"
          echo "sha256 $HASH"
          {
            echo "## DMG"
            echo ""
            echo "\`$HASH\`  \`${DMG##*/}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      
      - name: Upload DMG artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Transcriber-macOS-arm64
          path: dist-electron/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      
      - name: Upload build info
        run: |
          echo "Build completed at $(date)" > dist-electron/build-info.txt
          echo "Branch: ${{ github.ref_name }}" >> dist-electron/build-info.txt
          echo "Commit: ${{ github.sha }}" >> dist-electron/build-info.txt
      
      - name: Upload build info artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-info
          path: dist-electron/build-info.txt
          retention-days: 30

      # Non-PR only. The sign job downloads the unsigned .app bytes.
      # It never executes anything from this artifact.
      - name: Stage unsigned app for signing
        if: >
          vars.SIGNING_ENABLED == 'true' &&
          github.event_name != 'pull_request' &&
          (
            (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-beta.')) ||
            (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/beta/electron-menubar')
          )
        run: |
          set -euo pipefail
          rm -rf /tmp/unsigned-app-artifact
          mkdir -p /tmp/unsigned-app-artifact
          ditto dist-electron/mac-arm64/Transcriber.app /tmp/unsigned-app-artifact/Transcriber.app
          test -d /tmp/unsigned-app-artifact/Transcriber.app/Contents

      - name: Upload unsigned app for signing
        if: >
          vars.SIGNING_ENABLED == 'true' &&
          github.event_name != 'pull_request' &&
          (
            (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-beta.')) ||
            (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/beta/electron-menubar')
          )
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Transcriber-macOS-arm64-unsigned-app
          path: /tmp/unsigned-app-artifact
          if-no-files-found: error
          compression-level: 0
          retention-days: 5

  sign:
    name: Sign and notarize
    needs: build
    if: >
      vars.SIGNING_ENABLED == 'true' &&
      github.event_name != 'pull_request' &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-beta.')) ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/beta/electron-menubar')
      )
    environment: release
    runs-on: macos-14
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      notarized: ${{ steps.notarize_dmg.outputs.notarized }}
    steps:
      - name: Checkout signing scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require this SHA is on beta/electron-menubar
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/beta/electron-menubar

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Download unsigned app
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Transcriber-macOS-arm64-unsigned-app
          path: dist-electron/mac-arm64

      - name: Place unsigned app
        run: |
          set -euo pipefail
          if [ ! -d dist-electron/mac-arm64/Transcriber.app/Contents ] &&
             [ -d dist-electron/mac-arm64/Transcriber.app/Transcriber.app/Contents ]; then
            mv dist-electron/mac-arm64/Transcriber.app/Transcriber.app /tmp/Transcriber.app
            rm -rf dist-electron/mac-arm64/Transcriber.app
            mv /tmp/Transcriber.app dist-electron/mac-arm64/Transcriber.app
          fi
          test -d dist-electron/mac-arm64/Transcriber.app/Contents

      - name: Import Developer ID into a temporary keychain
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/macos-signing-keychain.sh setup

      - name: Developer ID sign Transcriber.app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/macos-codesign-app.sh

      - name: Read fuses on the signed app
        run: node scripts/read-electron-fuses.js --assert dist-electron/signed/Transcriber.app

      - name: Notarize and staple the app
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/macos-notarize.sh app

      - name: Build signed drag-to-Applications DMG
        run: bash electron/dmg/build-signed-dmg.sh

      - name: Unlock signing keychain
        run: bash scripts/macos-signing-keychain.sh unlock

      - name: Sign the signed DMG
        run: bash scripts/macos-codesign-dmg.sh dist-electron/signed/Transcriber-signed.dmg

      - name: Lock signing keychain
        run: bash scripts/macos-signing-keychain.sh lock

      - name: Notarize and staple the DMG
        id: notarize_dmg
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          bash scripts/macos-notarize.sh dmg dist-electron/signed/Transcriber-signed.dmg
          echo "notarized=true" >> "$GITHUB_OUTPUT"

      - name: Read fuses on the app inside the signed DMG
        run: |
          set -euo pipefail
          DMG=dist-electron/signed/Transcriber-signed.dmg
          ATTACH=$(hdiutil attach -nobrowse -readonly "$DMG")
          echo "$ATTACH"
          MOUNT=$(printf '%s\n' "$ATTACH" | awk '/\/Volumes\// { print $NF; exit }')
          test -n "$MOUNT"
          test -d "$MOUNT/Transcriber.app"
          node scripts/read-electron-fuses.js --assert "$MOUNT/Transcriber.app"
          hdiutil detach "$MOUNT"

      - name: Write updater artifacts
        run: bash scripts/macos-update-artifacts.sh

      - name: Screenshot signed DMG window
        run: |
          set -euo pipefail
          DMG=dist-electron/signed/Transcriber-signed.dmg
          ATTACH=$(hdiutil attach -nobrowse -readonly "$DMG")
          echo "$ATTACH"
          MOUNT=$(printf '%s\n' "$ATTACH" | awk '/\/Volumes\// { print $NF; exit }')
          test -n "$MOUNT"
          test -d "$MOUNT/Transcriber.app"
          test -L "$MOUNT/Applications"
          test ! -e "$MOUNT/Install Transcriber.command"
          test ! -e "$MOUNT/.payload"
          python3 electron/dmg/screenshot-dmg-window.py "$MOUNT" dist-electron/signed/dmg-window.png || true
          hdiutil detach "$MOUNT"

      - name: Upload signed artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Transcriber-macOS-arm64-signed
          path: dist-electron/signed/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Delete signing keychain
        if: always()
        run: bash scripts/macos-signing-keychain.sh teardown

  unsigned-path-contract:
    name: Unsigned path contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unsigned-path and updater contract tests
        run: node --test tests/signing-ci.test.mjs tests/dmg-install.test.mjs tests/electron-lows.test.mjs tests/updater-gate.test.mjs tests/updater-menu.test.mjs tests/tray-menu.test.mjs
      - name: Lint workflows with actionlint
        run: bash scripts/run-actionlint.sh

  release:
    name: Publish GitHub prerelease
    needs: sign
    if: >
      needs.sign.outputs.notarized == 'true' &&
      vars.SIGNING_ENABLED == 'true' &&
      github.event_name != 'pull_request' &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-beta.')) ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_github_release && github.ref == 'refs/heads/beta/electron-menubar')
      )
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download signed artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Transcriber-macOS-arm64-signed
          path: signed
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/beta/electron-menubar
          VERSION="$(node -p "require('./package.json').version")"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$'
          EXPECTED_TAG="v${VERSION}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [ "$TAG" != "$EXPECTED_TAG" ]; then
              echo "release: tag $TAG does not match package.json version $VERSION (expected $EXPECTED_TAG)"
              exit 1
            fi
          else
            TAG="$EXPECTED_TAG"
            if ! git rev-parse --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "release: tag ${TAG} does not exist. Push it first; the tag ruleset blocks gh from creating it."
              exit 1
            fi
          fi
          echo "Creating draft $TAG at $GITHUB_SHA"
          shopt -s nullglob
          FILES=(signed/*.dmg signed/*.zip signed/latest-mac.yml signed/beta-mac.yml signed/SHA256SUMS)
          test "${#FILES[@]}" -ge 4
          gh release create "$TAG" \
            --repo lifesized/youtube-transcriber \
            --draft \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "Signed and notarized Transcriber macOS build ${GITHUB_SHA}. James: publish this draft from the GitHub Releases UI when ready. Drafts are not picked up by electron-updater." \
            "${FILES[@]}"
