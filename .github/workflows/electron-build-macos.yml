            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"url":"https://www.youtube.com/watch?v=jNQXAC9IVRw","title":"CI save","segments":[{"start":0,"duration":1.5,"text":"hello from ci"}]}' \
