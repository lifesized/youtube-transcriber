name: Build Electron macOS DMG

on:
  workflow_dispatch:
  push:
    branches:
      - beta/electron-menubar

jobs:
  build:
    name: Build macOS DMG (arm64)
    runs-on: macos-14  # macOS arm64 runner
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Unit tests (packaging + migrations)
        run: npm run test:electron
      
      - name: Transcript cache integration test
        run: npm run test:cache
      
      - name: LLM summarize tests
        run: npm run test:llm
      
      - name: Notion save tests
        run: npm run test:notion
      
      - name: Build Next.js
        run: npm run build
      
      - name: Download ffmpeg (arm64 static)
        run: |
          set -euo pipefail
          mkdir -p electron/resources/bin
          # Pinned Martin Riedl macOS arm64 release (no Homebrew dylibs).
          LOCK=electron/ffmpeg.lock.json
          URL=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["url"])' "$LOCK")
          EXPECTED=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha256"])' "$LOCK")
          VERSION=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$LOCK")
          echo "Pinned ffmpeg $VERSION"
          echo "URL $URL"
          curl -L --fail -o /tmp/ffmpeg.zip "$URL"
          ACTUAL=$(shasum -a 256 /tmp/ffmpeg.zip | awk '{print $1}')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: ffmpeg zip sha256 mismatch"
            echo "expected $EXPECTED"
            echo "got      $ACTUAL"
            exit 1
          fi
          echo "✓ ffmpeg zip sha256 matches lock file"
          rm -rf /tmp/ffmpeg-extract
          mkdir -p /tmp/ffmpeg-extract
          unzip -o /tmp/ffmpeg.zip -d /tmp/ffmpeg-extract
          FFMPEG_SRC=$(find /tmp/ffmpeg-extract -type f -name ffmpeg | head -1)
          if [ -z "$FFMPEG_SRC" ]; then
            echo "ERROR: ffmpeg binary not found in zip"
            find /tmp/ffmpeg-extract -type f
            exit 1
          fi
          cp "$FFMPEG_SRC" electron/resources/bin/ffmpeg
          chmod +x electron/resources/bin/ffmpeg
          
          file electron/resources/bin/ffmpeg | tee /dev/stderr | grep -q "arm64" || {
            echo "ERROR: ffmpeg is not arm64!"
            lipo -info electron/resources/bin/ffmpeg || true
            file electron/resources/bin/ffmpeg
            exit 1
          }
          echo "----- otool -L ffmpeg (pre-pack) -----"
          otool -L electron/resources/bin/ffmpeg
          if otool -L electron/resources/bin/ffmpeg | grep -E '/opt/homebrew|/usr/local'; then
            echo "ERROR: ffmpeg links Homebrew or /usr/local dylibs"
            exit 1
          fi
          echo "✓ static arm64 ffmpeg bundled"
      
      - name: Download yt-dlp
        run: |
          set -euo pipefail
          mkdir -p electron/resources/bin
          LOCK=electron/yt-dlp.lock.json
          URL=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["url"])' "$LOCK")
          EXPECTED=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha256"])' "$LOCK")
          VERSION=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$LOCK")
          SUMS_URL=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sumsUrl"])' "$LOCK")
          ASSET=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["asset"])' "$LOCK")
          echo "Pinned yt-dlp $VERSION"
          echo "URL $URL"
          curl -L --fail -o /tmp/yt-dlp_macos "$URL"
          ACTUAL=$(shasum -a 256 /tmp/yt-dlp_macos | awk '{print $1}')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: yt-dlp sha256 mismatch"
            echo "expected $EXPECTED"
            echo "got      $ACTUAL"
            exit 1
          fi
          echo "✓ yt-dlp sha256 matches lock file"
          curl -L --fail -o /tmp/SHA2-256SUMS "$SUMS_URL"
          SUMS_HASH=$(awk -v asset="$ASSET" '$2 == asset { print $1; found=1 } END { if (!found) exit 1 }' /tmp/SHA2-256SUMS)
          if [ "$SUMS_HASH" != "$EXPECTED" ]; then
            echo "ERROR: lock sha256 does not match SHA2-256SUMS for $ASSET"
            echo "lock     $EXPECTED"
            echo "sums     $SUMS_HASH"
            exit 1
          fi
          echo "✓ lock sha256 matches yt-dlp SHA2-256SUMS ($ASSET)"
          cp /tmp/yt-dlp_macos electron/resources/bin/yt-dlp
          chmod +x electron/resources/bin/yt-dlp
      
      - name: Build Electron app
        run: npm run electron:build
        env:
          # Don't sign - we're doing ad-hoc signing only
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Assert DMG contains Install Transcriber.command
        run: |
          set -euo pipefail
          DMG=$(ls dist-electron/*.dmg | head -1)
          echo "Mounting $DMG"
          ATTACH=$(hdiutil attach -nobrowse -readonly "$DMG")
          echo "$ATTACH"
          MOUNT=$(printf '%s\n' "$ATTACH" | awk '/\/Volumes\// { print $NF; exit }')
          if [ -z "$MOUNT" ]; then
            echo "ERROR: could not find DMG mount point"
            exit 1
          fi
          echo "Mounted at $MOUNT"
          ls -la "$MOUNT"
          test -d "$MOUNT/Transcriber.app"
          test -f "$MOUNT/Install Transcriber.command"
          test -x "$MOUNT/Install Transcriber.command"
          echo "✓ DMG contains Transcriber.app and Install Transcriber.command"
          hdiutil detach "$MOUNT"

      - name: Assert asar contains every main-process require
        run: |
          set -euo pipefail
          APP="$PWD/dist-electron/mac-arm64/Transcriber.app"
          ASAR="$APP/Contents/Resources/app.asar"
          echo "----- asar first-party files -----"
          npx --no-install asar list "$ASAR" | grep -E '^(lib/|electron/)' || true
          echo "----- resolve requires from electron/main.js -----"
          node scripts/assert-packaged-requires.js --app "$APP" --entry electron/main.js
          node -e '
            const asar = require("@electron/asar");
            const files = asar.listPackage(process.argv[1]).map((p) => p.replace(/^\//, ""));
            if (!files.includes("lib/local-api-token.js")) {
              console.error("ERROR: lib/local-api-token.js is not inside app.asar");
              process.exit(1);
            }
            console.log("✓ app.asar contains lib/local-api-token.js");
          ' "$ASAR"

      - name: Assert no outbound app symlinks and Electron-ABI sqlite
        run: |
          set -euo pipefail
          APP="$PWD/dist-electron/mac-arm64/Transcriber.app"
          ELECTRON="$APP/Contents/MacOS/Transcriber"
          APP_REAL=$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$APP")

          echo "----- outbound symlink check -----"
          FAIL=0
          while IFS= read -r -d '' link; do
            target=$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$link")
            case "$target" in
              "$APP_REAL"|"$APP_REAL"/*) ;;
              *)
                echo "ERROR: symlink escapes Transcriber.app"
                echo "  link: $link"
                echo "  target: $target"
                FAIL=1
                ;;
            esac
          done < <(find "$APP" -type l -print0)
          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi
          echo "✓ no symlink resolves outside Transcriber.app"

          echo "----- better_sqlite3.node Electron ABI -----"
          REBUILT=$(find "$APP/Contents/Resources/app.asar.unpacked/node_modules/better-sqlite3" -name better_sqlite3.node | head -1)
          if [ -z "$REBUILT" ]; then
            echo "ERROR: rebuilt better_sqlite3.node missing under app.asar.unpacked"
            exit 1
          fi
          REBUILT_HASH=$(shasum -a 256 "$REBUILT" | awk '{print $1}')
          echo "rebuilt $REBUILT"
          echo "sha256 $REBUILT_HASH"
          COUNT=0
          while IFS= read -r addon; do
            HASH=$(shasum -a 256 "$addon" | awk '{print $1}')
            echo "  $HASH  $addon"
            if [ "$HASH" != "$REBUILT_HASH" ]; then
              echo "ERROR: $addon is not the Electron-ABI better_sqlite3.node"
              exit 1
            fi
            python3 -c 'import json,sys; print("require(%s); console.log(\"ok\");" % json.dumps(sys.argv[1]))' "$addon" > /tmp/require-sqlite.js
            set +e
            OUTPUT=$(ELECTRON_RUN_AS_NODE=1 "$ELECTRON" /tmp/require-sqlite.js 2>&1)
            STATUS=$?
            set -e
            if [ "$STATUS" -ne 0 ] || ! printf '%s\n' "$OUTPUT" | grep -qx 'ok'; then
              echo "ERROR: require() failed for $addon"
              echo "$OUTPUT"
              exit 1
            fi
            COUNT=$((COUNT + 1))
          done < <(find -P "$APP" -name better_sqlite3.node)
          if [ "$COUNT" -lt 1 ]; then
            echo "ERROR: no better_sqlite3.node found inside Transcriber.app"
            exit 1
          fi
          echo "✓ $COUNT better_sqlite3.node file(s) match Electron ABI and load"

      - name: Launch packaged Transcriber.app
        run: |
          set -euo pipefail
          ROOT="$PWD"
          APP_PATH="$ROOT/dist-electron/mac-arm64/Transcriber.app/Contents/MacOS/Transcriber"
          DATA_DIR="$(mktemp -d /tmp/transcriber-launch-XXXXXX)"
          mkdir -p "$DATA_DIR/Library/Application Support/Transcriber"
          TOKEN="$(openssl rand -hex 32)"
          LOG="$DATA_DIR/main.log"
          PORT=19720

          cleanup() {
            if [ -n "${APP_PID:-}" ]; then
              kill "$APP_PID" 2>/dev/null || true
              wait "$APP_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          HOME="$DATA_DIR" \
          TRANSCRIBER_LOCAL_TOKEN="$TOKEN" \
          ELECTRON_ENABLE_LOGGING=1 \
          "$APP_PATH" > "$LOG" 2>&1 &
          APP_PID=$!
          echo "Launched packaged app PID $APP_PID"

          HEALTH=""
          for i in $(seq 1 60); do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "ERROR: Transcriber.app exited early"
              echo "----- packaged app log -----"
              cat "$LOG" || true
              exit 1
            fi
            if grep -qE "Uncaught Exception|UnhandledPromiseRejectionWarning" "$LOG" 2>/dev/null; then
              echo "ERROR: Uncaught Exception in packaged app"
              echo "----- packaged app log -----"
              cat "$LOG" || true
              exit 1
            fi
            set +e
            HEALTH=$(curl -sS -o /tmp/packaged-health.json -w "%{http_code}" \
              -H "Authorization: Bearer ${TOKEN}" \
              "http://127.0.0.1:${PORT}/api/health")
            set -e
            if [ "$HEALTH" = "200" ]; then
              echo "----- packaged-launch health -----"
              cat /tmp/packaged-health.json
              echo ""
              echo "✓ packaged Transcriber.app /api/health 200"
              break
            fi
            echo "  launch wait $i/60 (http=${HEALTH:-curl-fail})"
            if [ "$i" -eq 60 ]; then
              echo "ERROR: packaged app did not become healthy"
              echo "----- packaged app log -----"
              cat "$LOG" || true
              exit 1
            fi
            sleep 1
          done
          echo "----- packaged app log -----"
          cat "$LOG" || true
      
      - name: Test packaged app (smoke test)
        run: |
          set -euo pipefail
          ROOT="$PWD"
          APP_PATH="$ROOT/dist-electron/mac-arm64/Transcriber.app/Contents/MacOS/Transcriber"
          SQLITE_PATH="$ROOT/dist-electron/mac-arm64/Transcriber.app/Contents/Resources/app.asar.unpacked/node_modules/better-sqlite3"
          STANDALONE="$ROOT/dist-electron/mac-arm64/Transcriber.app/Contents/Resources/standalone"
          SERVER_PATH="$STANDALONE/server.js"
          BIN_DIR="$ROOT/dist-electron/mac-arm64/Transcriber.app/Contents/Resources/bin"
          
          echo "Smoke test: verify packaging..."
          
          # 1. Check Electron binary exists and is arm64
          if [ ! -f "$APP_PATH" ]; then
            echo "ERROR: Electron app binary not found at $APP_PATH"
            exit 1
          fi
          
          file "$APP_PATH" | grep -q "arm64" || {
            echo "ERROR: Electron binary is not arm64"
            file "$APP_PATH"
            exit 1
          }
          echo "✓ Electron binary exists and is arm64"
          
          # 2. Check better-sqlite3 native module was rebuilt for Electron
          if [ ! -d "$SQLITE_PATH" ]; then
            echo "ERROR: better-sqlite3 not found at $SQLITE_PATH"
            exit 1
          fi
          
          SQLITE_ADDON=$(find "$SQLITE_PATH" -name "better_sqlite3.node" | head -1)
          if [ -z "$SQLITE_ADDON" ]; then
            echo "ERROR: better-sqlite3 native addon (.node) not found"
            exit 1
          fi
          
          echo "✓ better-sqlite3 native addon exists: $SQLITE_ADDON"
          
          # 3. Test ELECTRON_RUN_AS_NODE works (simple Node script)
          echo "console.log('OK')" > /tmp/test-node.js
          OUTPUT=$(ELECTRON_RUN_AS_NODE=1 "$APP_PATH" /tmp/test-node.js 2>&1)
          if [ "$OUTPUT" != "OK" ]; then
            echo "ERROR: ELECTRON_RUN_AS_NODE test failed"
            echo "Output: $OUTPUT"
            exit 1
          fi
          echo "✓ ELECTRON_RUN_AS_NODE works"

          # 3b. Native-host wrapper target exists under app.asar.unpacked, then ping it
          RESOURCES="$ROOT/dist-electron/mac-arm64/Transcriber.app/Contents/Resources"
          HOST_JS="$RESOURCES/app.asar.unpacked/tools/native-host/transcriber-host.js"
          echo "----- native host wrapper target -----"
          ls -la "$HOST_JS"
          if [ ! -f "$HOST_JS" ]; then
            echo "ERROR: wrapper target missing: $HOST_JS"
            echo "----- Resources listing -----"
            ls -la "$RESOURCES" || true
            find "$RESOURCES" -name 'transcriber-host.js' || true
            exit 1
          fi
          echo "✓ native host script exists at wrapper target"

          WRAPPER=/tmp/transcriber-host.sh
          printf '#!/bin/sh\nexport ELECTRON_RUN_AS_NODE=1\nexec "%s" "%s" "$@"\n' \
            "$APP_PATH" "$HOST_JS" > "$WRAPPER"
          chmod +x "$WRAPPER"

          echo "----- native-host ping -----"
          NMH_HOME="$(mktemp -d /tmp/transcriber-nmh-XXXXXX)"
          python3 - <<'PY' | HOME="$NMH_HOME" "$WRAPPER" > /tmp/nmh-pong.bin
          import sys, struct, json
          payload = json.dumps({"id": "ci-ping", "cmd": "ping"}).encode("utf-8")
          sys.stdout.buffer.write(struct.pack("<I", len(payload)))
          sys.stdout.buffer.write(payload)
          sys.stdout.buffer.flush()
          PY
          python3 - <<'PY'
          import json, struct, sys
          data = open("/tmp/nmh-pong.bin", "rb").read()
          print("native-host ping raw bytes:", len(data))
          if len(data) < 4:
              print("ERROR: native host produced no framed reply", file=sys.stderr)
              sys.exit(1)
          n = struct.unpack_from("<I", data, 0)[0]
          msg = json.loads(data[4:4 + n])
          print("native-host ping reply:", json.dumps(msg, sort_keys=True))
          if msg.get("id") != "ci-ping" or not msg.get("ok") or not msg.get("pong"):
              print("ERROR: unexpected ping reply", file=sys.stderr)
              sys.exit(1)
          print("✓ native host ping")
          PY
          
          # 4. Check bundled binaries exist, are arm64, and are not Homebrew-linked
          for binary in ffmpeg yt-dlp; do
            if [ ! -f "$BIN_DIR/$binary" ]; then
              echo "ERROR: $binary not found in $BIN_DIR"
              exit 1
            fi
            file "$BIN_DIR/$binary" | grep -q "arm64" || {
              echo "ERROR: $binary is not arm64"
              file "$BIN_DIR/$binary"
              exit 1
            }
            echo "✓ $binary exists and is arm64"
            echo "----- otool -L $binary -----"
            otool -L "$BIN_DIR/$binary"
            if otool -L "$BIN_DIR/$binary" | grep -E '/opt/homebrew|/usr/local'; then
              echo "ERROR: $binary links /opt/homebrew or /usr/local"
              exit 1
            fi
            echo "✓ $binary has no Homebrew /usr/local linkage"
          done

          echo "----- ffmpeg -version -----"
          "$BIN_DIR/ffmpeg" -version | tee /tmp/ffmpeg-version.txt
          head -n 1 /tmp/ffmpeg-version.txt
          ENCODE_OUT="$(mktemp /tmp/transcriber-ffmpeg-XXXXXX.m4a)"
          "$BIN_DIR/ffmpeg" -nostdin -hide_banner -y -f lavfi -i sine=d=1 -ac 1 "$ENCODE_OUT"
          test -s "$ENCODE_OUT"
          echo "✓ ffmpeg -version and sine encode"
          echo "----- yt-dlp --version -----"
          "$BIN_DIR/yt-dlp" --version
          echo "✓ yt-dlp --version"
          
          # 5. Standalone payload (outside asar) — server, node_modules, static, public, prisma
          for required in \
            "$SERVER_PATH" \
            "$STANDALONE/node_modules" \
            "$STANDALONE/.next/static" \
            "$STANDALONE/public" \
            "$STANDALONE/prisma/migrations" \
            "$STANDALONE/node_modules/@prisma/client" \
            "$STANDALONE/node_modules/better-sqlite3"
          do
            if [ ! -e "$required" ]; then
              echo "ERROR: packaged payload missing $required"
              exit 1
            fi
            echo "✓ present: $required"
          done
          
          ENGINE_HIT=$(find "$STANDALONE/node_modules/.prisma" "$STANDALONE/node_modules/@prisma" \
            \( -name '*darwin-arm64*' -o -name '*darwin_arm64*' \) 2>/dev/null | head -1)
          if [ -z "$ENGINE_HIT" ]; then
            echo "ERROR: no darwin-arm64 Prisma engine in standalone payload"
            exit 1
          fi
          echo "✓ Prisma darwin-arm64 engine: $ENGINE_HIT"
          
          # Tray template PNGs must be packaged and non-empty (macOS menu bar)
          TRAY_DIR="$ROOT/dist-electron/mac-arm64/Transcriber.app/Contents/Resources/app.asar.unpacked/electron/resources"
          for png in trayTemplate.png trayTemplate@2x.png; do
            PNG_PATH="$TRAY_DIR/$png"
            if [ ! -f "$PNG_PATH" ]; then
              echo "ERROR: packaged tray icon missing $PNG_PATH"
              exit 1
            fi
            PNG_SIZE=$(wc -c < "$PNG_PATH" | tr -d ' ')
            if [ "$PNG_SIZE" -lt 50 ]; then
              echo "ERROR: packaged $png is empty ($PNG_SIZE bytes)"
              exit 1
            fi
            file "$PNG_PATH" | grep -qi "PNG" || {
              echo "ERROR: packaged $png is not a PNG"
              file "$PNG_PATH"
              exit 1
            }
            echo "✓ packaged $png ($PNG_SIZE bytes)"
          done
          
          echo ""
          echo "✓ Packaging checks passed — launching packaged server..."
          
          # 6. Launch packaged server with ELECTRON_RUN_AS_NODE on a temp data dir
          DATA_DIR="$(mktemp -d /tmp/transcriber-ci-XXXXXX)"
          mkdir -p "$DATA_DIR/Library/Application Support/Transcriber"
          mkdir -p "$STANDALONE/tmp"
          TOKEN="$(openssl rand -hex 32)"
          DB_PATH="$DATA_DIR/Library/Application Support/Transcriber/transcriber.db"
          LOG_FILE="$DATA_DIR/server.log"
          PORT=19721
          
          cleanup() {
            if [ -n "${SERVER_PID:-}" ]; then
              kill "$SERVER_PID" 2>/dev/null || true
              wait "$SERVER_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          
          (
            cd "$STANDALONE"
            HOME="$DATA_DIR" \
            ELECTRON_RUN_AS_NODE=1 \
            NODE_ENV=production \
            PORT="$PORT" \
            HOSTNAME=127.0.0.1 \
            DATABASE_URL="file:${DB_PATH}" \
            PRISMA_MIGRATIONS_DIR="$STANDALONE/prisma/migrations" \
            TRANSCRIBER_LOCAL_TOKEN="$TOKEN" \
            PATH="$BIN_DIR:$PATH" \
            FFMPEG_PATH="$BIN_DIR/ffmpeg" \
            YTDLP_PATH="$BIN_DIR/yt-dlp" \
            "$APP_PATH" "$SERVER_PATH" -p "$PORT" --hostname 127.0.0.1
          ) > "$LOG_FILE" 2>&1 &
          SERVER_PID=$!
          
          echo "Server PID $SERVER_PID — waiting for /api/health 200..."
          HEALTH_BODY=""
          for i in $(seq 1 60); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "ERROR: packaged server process exited during startup"
              echo "----- server log -----"
              cat "$LOG_FILE" || true
              exit 1
            fi
            set +e
            HEALTH_BODY=$(curl -sS -w "\n%{http_code}" \
              -H "Authorization: Bearer ${TOKEN}" \
              "http://127.0.0.1:${PORT}/api/health")
            CURL_OK=$?
            set -e
            if [ "$CURL_OK" -eq 0 ]; then
              HEALTH_CODE=$(printf '%s' "$HEALTH_BODY" | tail -n 1)
              HEALTH_JSON=$(printf '%s' "$HEALTH_BODY" | sed '$d')
              if [ "$HEALTH_CODE" = "200" ]; then
                echo "✓ Health endpoint returned 200 on attempt $i"
                echo "----- health body -----"
                echo "$HEALTH_JSON"
                echo "----- end health body -----"
                break
              fi
            fi
            echo "  Attempt $i/60 (http=${HEALTH_CODE:-curl-fail})..."
            HEALTH_CODE=""
            sleep 1
            if [ "$i" -eq 60 ]; then
              echo "ERROR: health endpoint did not return 200"
              echo "----- server log -----"
              cat "$LOG_FILE" || true
              exit 1
            fi
          done
          
          echo "DB-touching API call: GET /api/transcripts"
          TRANSCRIPTS_BODY=$(curl -sS -w "\n%{http_code}" \
            -H "Authorization: Bearer ${TOKEN}" \
            "http://127.0.0.1:${PORT}/api/transcripts")
          TRANSCRIPTS_CODE=$(printf '%s' "$TRANSCRIPTS_BODY" | tail -n 1)
          TRANSCRIPTS_JSON=$(printf '%s' "$TRANSCRIPTS_BODY" | sed '$d')
          if [ "$TRANSCRIPTS_CODE" != "200" ]; then
            echo "ERROR: GET /api/transcripts returned $TRANSCRIPTS_CODE"
            echo "$TRANSCRIPTS_JSON"
            echo "----- server log -----"
            cat "$LOG_FILE" || true
            exit 1
          fi
          echo "✓ GET /api/transcripts returned 200"
          echo "$TRANSCRIPTS_JSON"
          
          echo ""
          echo "✓ All smoke tests passed!"
      
      - name: Report packaged size
        run: |
          set -euo pipefail
          APP="$PWD/dist-electron/mac-arm64/Transcriber.app"
          DMG=$(ls dist-electron/*.dmg | head -1)
          echo "===== packaged size ====="
          echo "App:"
          du -sh "$APP"
          echo "Resources:"
          du -sh "$APP/Contents/Resources"/* | sort -hr
          echo "standalone:"
          du -sh "$APP/Contents/Resources/standalone"/* 2>/dev/null | sort -hr
          echo "standalone/node_modules:"
          du -sh "$APP/Contents/Resources/standalone/node_modules"/* 2>/dev/null | sort -hr
          echo "Electron locales:"
          du -sh "$APP/Contents/Frameworks/Electron Framework.framework/Resources"/*.lproj 2>/dev/null | sort -hr || true
          echo "asar:"
          du -sh "$APP/Contents/Resources/app.asar" "$APP/Contents/Resources/app.asar.unpacked" 2>/dev/null || true
          echo "DMG:"
          ls -lh "$DMG"
          APP_SIZE=$(du -sh "$APP" | awk '{print $1}')
          DMG_SIZE=$(ls -lh "$DMG" | awk '{print $5}')
          {
            echo "## Size"
            echo ""
            echo "- App: \`$APP_SIZE\`"
            echo "- DMG: \`$DMG_SIZE\` (\`${DMG##*/}\`)"
            echo "- Previous CI zip (unpruned): ~459 MB"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: DMG sha256
        run: |
          set -euo pipefail
          DMG=$(ls dist-electron/*.dmg | head -1)
          HASH=$(shasum -a 256 "$DMG" | awk '{print $1}')
          echo "DMG $DMG"
          echo "sha256 $HASH"
          {
            echo "## DMG"
            echo ""
            echo "\`$HASH\`  \`${DMG##*/}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Transcriber-macOS-arm64
          path: dist-electron/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      
      - name: Upload build info
        run: |
          echo "Build completed at $(date)" > dist-electron/build-info.txt
          echo "Branch: ${{ github.ref_name }}" >> dist-electron/build-info.txt
          echo "Commit: ${{ github.sha }}" >> dist-electron/build-info.txt
      
      - name: Upload build info artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: dist-electron/build-info.txt
          retention-days: 30
