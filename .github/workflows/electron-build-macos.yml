            exit 1
          fi
          RES_DIR="$ROOT/dist-electron/mac-arm64/Transcriber.app/Contents/Resources"
          ICON_PATH="$RES_DIR/$ICON_FILE"
          if [ ! -f "$ICON_PATH" ] && [ -f "$ICON_PATH.icns" ]; then
            ICON_PATH="$ICON_PATH.icns"
          fi
          if [ ! -f "$ICON_PATH" ]; then
