          SAVE_JSON=$(printf '%s' "$SAVE_BODY" | sed '$d')
          if [ "$SAVE_CODE" != "201" ]; then
            echo "ERROR: POST /api/transcripts returned $SAVE_CODE"
            echo "$SAVE_JSON"
            echo "----- server log -----"
            cat "$LOG_FILE" || true
            exit 1
          fi
          SAVE_ID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<<"$SAVE_JSON")
          if [ -z "$SAVE_ID" ]; then
            echo "ERROR: POST /api/transcripts did not return an id"
            echo "$SAVE_JSON"
            exit 1
          fi
          GET_BODY=$(curl -sS -w "\n%{http_code}" \
            -H "Authorization: Bearer ${TOKEN}" \
            "http://127.0.0.1:${PORT}/api/transcripts/${SAVE_ID}")
          GET_CODE=$(printf '%s' "$GET_BODY" | tail -n 1)
          GET_JSON=$(printf '%s' "$GET_BODY" | sed '$d')
          if [ "$GET_CODE" != "200" ]; then
            echo "ERROR: GET /api/transcripts/$SAVE_ID returned $GET_CODE"
            echo "$GET_JSON"
            exit 1
          fi
          echo "$GET_JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); t=json.loads(d["transcript"]); assert "hello from ci" in t[0]["text"], d; print("✓ packaged transcript save/read", d["id"])'
          
