name: Build Electron macOS DMG

on:
  workflow_dispatch:
    inputs:
      publish_github_release:
        description: Publish a GitHub prerelease (only if this run signed and notarized)
        type: boolean
        default: false
  push:
    branches:
      - beta/electron-menubar
    tags:
      - "v*-beta.*"
  pull_request:
    branches:
      - beta/electron-menubar

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS DMG (arm64)
    runs-on: macos-14  # macOS arm64 runner
    timeout-minutes: 50
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Unit tests (packaging + migrations)
        run: npm run test:electron
      
      - name: Transcript cache integration test
        run: npm run test:cache
      
      - name: LLM summarize tests
        run: npm run test:llm
      
      - name: Notion save tests
        run: npm run test:notion
      
      - name: LinkedIn capture tests
        run: npm run test:linkedin

      - name: Home page library gate tests
        run: npm run test:library-gate

      - name: Local API cookie auth (middleware) tests
        run: npm run test:middleware

      - name: Frame headers tests
        run: npm run test:headers

      - name: Typecheck
        run: npx tsc --noEmit -p .
      
      - name: Build Next.js
        run: npm run build
      
      - name: Download ffmpeg (arm64 static)
        run: |
          set -euo pipefail
          mkdir -p electron/resources/bin
          # Pinned Martin Riedl macOS arm64 release (no Homebrew dylibs).
          LOCK=electron/ffmpeg.lock.json
          URL=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["url"])' "$LOCK")
          EXPECTED=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha256"])' "$LOCK")
          VERSION=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$LOCK")
          echo "Pinned ffmpeg $VERSION"
          echo "URL $URL"
          curl -L --fail -o /tmp/ffmpeg.zip "$URL"
          ACTUAL=$(shasum -a 256 /tmp/ffmpeg.zip | awk '{print $1}')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: ffmpeg zip sha256 mismatch"
            echo "expected $EXPECTED"
            echo "got      $ACTUAL"
            exit 1
          fi
          echo "✓ ffmpeg zip sha256 matches lock file"
          rm -rf /tmp/ffmpeg-extract
          mkdir -p /tmp/ffmpeg-extract
          unzip -o /tmp/ffmpeg.zip -d /tmp/ffmpeg-extract
          FFMPEG_SRC=$(find /tmp/ffmpeg-extract -type f -name ffmpeg | head -1)
          if [ -z "$FFMPEG_SRC" ]; then
            echo "ERROR: ffmpeg binary not found in zip"
            find /tmp/ffmpeg-extract -type f
            exit 1
          fi
          cp "$FFMPEG_SRC" electron/resources/bin/ffmpeg
          chmod +x electron/resources/bin/ffmpeg
          
          file electron/resources/bin/ffmpeg | tee /dev/stderr | grep -q "arm64" || {
            echo "ERROR: ffmpeg is not arm64!"
            lipo -info electron/resources/bin/ffmpeg || true
            file electron/resources/bin/ffmpeg
            exit 1
          }
          echo "----- otool -L ffmpeg (pre-pack) -----"
          otool -L electron/resources/bin/ffmpeg
          if otool -L electron/resources/bin/ffmpeg | grep -E '/opt/homebrew|/usr/local'; then
            echo "ERROR: ffmpeg links Homebrew or /usr/local dylibs"
            exit 1
          fi
          echo "✓ static arm64 ffmpeg bundled"
      
      - name: Download yt-dlp
        run: |
          set -euo pipefail
          mkdir -p electron/resources/bin
          LOCK=electron/yt-dlp.lock.json
          URL=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["url"])' "$LOCK")
          EXPECTED=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha256"])' "$LOCK")
          VERSION=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$LOCK")
          SUMS_URL=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sumsUrl"])' "$LOCK")
          ASSET=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["asset"])' "$LOCK")
          echo "Pinned yt-dlp $VERSION"
          echo "URL $URL"
          curl -L --fail -o /tmp/yt-dlp_macos "$URL"
          ACTUAL=$(shasum -a 256 /tmp/yt-dlp_macos | awk '{print $1}')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: yt-dlp sha256 mismatch"
            echo "expected $EXPECTED"
            echo "got      $ACTUAL"
            exit 1
          fi
          echo "✓ yt-dlp sha256 matches lock file"
          curl -L --fail -o /tmp/SHA2-256SUMS "$SUMS_URL"
          SUMS_HASH=$(awk -v asset="$ASSET" '$2 == asset { print $1; found=1 } END { if (!found) exit 1 }' /tmp/SHA2-256SUMS)
          if [ "$SUMS_HASH" != "$EXPECTED" ]; then
            echo "ERROR: lock sha256 does not match SHA2-256SUMS for $ASSET"
            echo "lock     $EXPECTED"
            echo "sums     $SUMS_HASH"
            exit 1
          fi
          echo "✓ lock sha256 matches yt-dlp SHA2-256SUMS ($ASSET)"
          cp /tmp/yt-dlp_macos electron/resources/bin/yt-dlp
          chmod +x electron/resources/bin/yt-dlp
      
      - name: Build Electron app
        run: npm run electron:build
        env:
          # Don't sign - we're doing ad-hoc signing only
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Assert DMG contains Install Transcriber.command
        run: |
          set -euo pipefail
          DMG=$(find dist-electron -maxdepth 1 -name '*.dmg' -print | head -1)
          echo "Mounting $DMG"
          ATTACH=$(hdiutil attach -nobrowse -readonly "$DMG")
          echo "$ATTACH"
          MOUNT=$(printf '%s\n' "$ATTACH" | awk '/\/Volumes\// { print $NF; exit }')
          if [ -z "$MOUNT" ]; then
            echo "ERROR: could not find DMG mount point"
            exit 1
          fi
          echo "Mounted at $MOUNT"
          ls -la "$MOUNT"
          ls -lO "$MOUNT"
          test -d "$MOUNT/.payload/Transcriber.app"
          test -f "$MOUNT/Install Transcriber.command"
          test -x "$MOUNT/Install Transcriber.command"
          echo "✓ DMG contains .payload/Transcriber.app and Install Transcriber.command"

          HELPER="$MOUNT/Install Transcriber.command"
          RF_SIZE=$(stat -f%z "$HELPER/..namedfork/rsrc" 2>/dev/null || echo 0)
          echo "helper resource fork: $RF_SIZE bytes"
          if [ "${RF_SIZE:-0}" -lt 100 ]; then
            echo "ERROR: Install Transcriber.command has no custom-icon resource fork"
            xattr -l "$HELPER" || true
            exit 1
          fi
          echo "✓ helper resource fork is non-empty"

          python3 electron/dmg/assert-helper-icon.py "$HELPER"

          ATTRS=$(GetFileInfo -a "$HELPER" || true)
          HAS_C=$(GetFileInfo -aC "$HELPER" || true)
          HAS_E=$(GetFileInfo -ae "$HELPER" || true)
          echo "GetFileInfo -a: $ATTRS"
          echo "GetFileInfo -aC: $HAS_C"
          echo "GetFileInfo -ae: $HAS_E"
          if [ "$HAS_C" != "1" ]; then
            echo "ERROR: GetFileInfo custom-icon flag (C) is not set"
            xattr -l "$HELPER" || true
            exit 1
          fi
          echo "✓ GetFileInfo custom-icon flag (C) is set"
          if [ "$HAS_E" != "1" ]; then
            echo "ERROR: GetFileInfo extension-hidden flag (E) is not set"
            xattr -l "$HELPER" || true
            exit 1
          fi
          echo "✓ GetFileInfo extension-hidden flag (E) is set"

          ls -lOa "$MOUNT/.payload" || true
          if [ -e "$MOUNT/Transcriber.app" ]; then
            echo "ERROR: Transcriber.app is still at the DMG root; it belongs in .payload/"
            exit 1
          fi
          echo "✓ Transcriber.app is hidden in .payload/ (Finder hides dot-folders)"
          if xattr -p com.apple.FinderInfo "$MOUNT/.payload/Transcriber.app" >/dev/null 2>&1; then
            echo "ERROR: mounted Transcriber.app still has FinderInfo (breaks codesign --strict and copies into /Applications)"
            xattr -l "$MOUNT/.payload/Transcriber.app" || true
            exit 1
          fi
          echo "✓ mounted Transcriber.app has no FinderInfo"

          test ! -e "$MOUNT/Applications"
          echo "✓ no Applications symlink"

          echo "----- codesign --verify --deep --strict on mounted .app -----"
          codesign --verify --deep --strict "$MOUNT/.payload/Transcriber.app"
          echo "✓ mounted Transcriber.app codesign --verify --deep --strict"

          echo "----- fuses and CDHash of the mounted .app (what users install) -----"
          MOUNTED_FUSES=$(npx --no-install @electron/fuses read --app "$MOUNT/.payload/Transcriber.app")
          echo "$MOUNTED_FUSES"
          for fuse in EnableNodeOptionsEnvironmentVariable EnableNodeCliInspectArguments; do
            echo "$MOUNTED_FUSES" | grep "$fuse" | grep -q Disabled || {
              echo "ERROR: $fuse is not off in the DMG's Transcriber.app"
              exit 1
            }
          done
          echo "✓ mounted Transcriber.app fuses NodeOptions and Inspect are off"
          cdhash() { codesign -dvvv "$1" 2>&1 | awk -F= '/^CDHash=/ { print $2; exit }'; }
          BUILT_CDHASH=$(cdhash dist-electron/mac-arm64/Transcriber.app)
          MOUNTED_CDHASH=$(cdhash "$MOUNT/.payload/Transcriber.app")
          echo "CDHash dist-electron $BUILT_CDHASH"
          echo "CDHash mounted DMG   $MOUNTED_CDHASH"
          if [ -z "$MOUNTED_CDHASH" ] || [ "$MOUNTED_CDHASH" != "$BUILT_CDHASH" ]; then
            echo "ERROR: the DMG's Transcriber.app is not the app the later steps check"
            exit 1
          fi
          echo "✓ mounted Transcriber.app CDHash matches dist-electron/mac-arm64"

          # Best-effort screenshot of the mounted DMG window. Do not fail the job.
          python3 electron/dmg/screenshot-dmg-window.py "$MOUNT" dist-electron/dmg-window.png || true

          hdiutil detach "$MOUNT"

      - name: Upload DMG window screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dmg-window
          path: |
            dist-electron/dmg-window.png
            dist-electron/signed/dmg-window.png
          if-no-files-found: warn
          retention-days: 14

      - name: Assert asar contains every main-process require
        run: |
          set -euo pipefail
          APP="$PWD/dist-electron/mac-arm64/Transcriber.app"
          ASAR="$APP/Contents/Resources/app.asar"
          echo "----- asar first-party files -----"
          npx --no-install asar list "$ASAR" | grep -E '^(lib/|electron/)' || true
          echo "----- resolve requires from electron/main.js -----"
          node scripts/assert-packaged-requires.js --app "$APP" --entry electron/main.js
          node -e '
            const asar = require("@electron/asar");
            const files = asar.listPackage(process.argv[1]).map((p) => p.replace(/^\//, ""));
            if (!files.includes("lib/local-api-token.js")) {
              console.error("ERROR: lib/local-api-token.js is not inside app.asar");
              process.exit(1);
            }
            console.log("✓ app.asar contains lib/local-api-token.js");
          ' "$ASAR"

      - name: Assert no outbound app symlinks and Electron-ABI sqlite
        run: |
          set -euo pipefail
          APP="$PWD/dist-electron/mac-arm64/Transcriber.app"
          ELECTRON="$APP/Contents/MacOS/Transcriber"
          APP_REAL=$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$APP")

          echo "----- outbound symlink check -----"
          FAIL=0
          while IFS= read -r -d '' link; do
            target=$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$link")
            case "$target" in
              "$APP_REAL"|"$APP_REAL"/*) ;;
              *)
                echo "ERROR: symlink escapes Transcriber.app"
                echo "  link: $link"
                echo "  target: $target"
                FAIL=1
                ;;
            esac
          done < <(find "$APP" -type l -print0)
          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi
          echo "✓ no symlink resolves outside Transcriber.app"

          echo "----- better_sqlite3.node Electron ABI -----"
          REBUILT=$(find "$APP/Contents/Resources/app.asar.unpacked/node_modules/better-sqlite3" -name better_sqlite3.node | head -1)
          if [ -z "$REBUILT" ]; then
            echo "ERROR: rebuilt better_sqlite3.node missing under app.asar.unpacked"
            exit 1
          fi
          REBUILT_HASH=$(shasum -a 256 "$REBUILT" | awk '{print $1}')
          echo "rebuilt $REBUILT"
          echo "sha256 $REBUILT_HASH"
          COUNT=0
          while IFS= read -r addon; do
            HASH=$(shasum -a 256 "$addon" | awk '{print $1}')
            echo "  $HASH  $addon"
            if [ "$HASH" != "$REBUILT_HASH" ]; then
              echo "ERROR: $addon is not the Electron-ABI better_sqlite3.node"
              exit 1
            fi
            python3 -c 'import json,sys; print("require(%s); console.log(\"ok\");" % json.dumps(sys.argv[1]))' "$addon" > /tmp/require-sqlite.js
            set +e
            OUTPUT=$(ELECTRON_RUN_AS_NODE=1 "$ELECTRON" /tmp/require-sqlite.js 2>&1)
            STATUS=$?
            set -e
            if [ "$STATUS" -ne 0 ] || ! printf '%s\n' "$OUTPUT" | grep -qx 'ok'; then
              echo "ERROR: require() failed for $addon"
              echo "$OUTPUT"
              exit 1
            fi
            COUNT=$((COUNT + 1))
          done < <(find -P "$APP" -name better_sqlite3.node)
          if [ "$COUNT" -lt 1 ]; then
            echo "ERROR: no better_sqlite3.node found inside Transcriber.app"
            exit 1
          fi
          echo "✓ $COUNT better_sqlite3.node file(s) match Electron ABI and load"

          echo "----- electron fuses -----"
          FUSES=$(npx --no-install @electron/fuses read --app "$APP")
          echo "$FUSES"
          echo "$FUSES" | grep EnableNodeOptionsEnvironmentVariable | grep -q Disabled || {
            echo "ERROR: NODE_OPTIONS fuse is not off"
            exit 1
          }
          echo "$FUSES" | grep EnableNodeCliInspectArguments | grep -q Disabled || {
            echo "ERROR: inspect fuse is not off"
            exit 1
          }
          echo "✓ fuses NodeOptions and Inspect are off"

      - name: Launch packaged Transcriber.app
        timeout-minutes: 4
        run: |
          set -euo pipefail
          ROOT="$PWD"
          APP_PATH="$ROOT/dist-electron/mac-arm64/Transcriber.app/Contents/MacOS/Transcriber"
          DATA_DIR="$(mktemp -d /tmp/transcriber-launch-XXXXXX)"
          APP_STATE=$(HOME="$DATA_DIR" node -p "require('./electron/config.js').resolveAppStateDir()")
          APP_LOG=$(HOME="$DATA_DIR" node -p "require('./electron/config.js').resolveAppLogDir()")
          CHECKOUT_STATE=$(HOME="$DATA_DIR" node -p "require('./electron/config.js').resolveCheckoutStateDir()")
          mkdir -p "$APP_STATE" "$CHECKOUT_STATE"
          printf 'checkout-sentinel\n' > "$CHECKOUT_STATE/.keep"
          TOKEN="$(openssl rand -hex 32)"
          LOG="$DATA_DIR/main.log"
          PORT=$(node -p "require('./electron/config.js').port")

          cleanup() {
            if [ -n "${APP_PID:-}" ]; then
              kill "$APP_PID" 2>/dev/null || true
              sleep 1
              kill -9 "$APP_PID" 2>/dev/null || true
              wait "$APP_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          HOME="$DATA_DIR" \
          TRANSCRIBER_LOCAL_TOKEN="$TOKEN" \
          ELECTRON_ENABLE_LOGGING=1 \
          "$APP_PATH" > "$LOG" 2>&1 &
          APP_PID=$!
          echo "Launched packaged app PID $APP_PID"

          HEALTH=""
          for i in $(seq 1 60); do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "ERROR: Transcriber.app exited early"
              echo "----- packaged app log -----"
              cat "$LOG" || true
              exit 1
            fi
            if grep -qE "Uncaught Exception|UnhandledPromiseRejectionWarning" "$LOG" 2>/dev/null; then
              echo "ERROR: Uncaught Exception in packaged app"
              echo "----- packaged app log -----"
              cat "$LOG" || true
              exit 1
            fi
            set +e
            HEALTH=$(curl -sS -o /tmp/packaged-health.json -w "%{http_code}" \
              -H "Authorization: Bearer ${TOKEN}" \
              "http://127.0.0.1:${PORT}/api/health")
            set -e
            if [ "$HEALTH" = "200" ]; then
              echo "----- packaged-launch health -----"
              cat /tmp/packaged-health.json
              echo ""
              echo "✓ packaged Transcriber.app /api/health 200"
              echo "----- unauthenticated /api/health must stay 401 -----"
              set +e
              NOAUTH=$(curl -sS -o /tmp/packaged-health-noauth.txt -w "%{http_code}" \
                "http://127.0.0.1:${PORT}/api/health")
              set -e
              if [ "$NOAUTH" != "401" ]; then
                echo "ERROR: unauthenticated /api/health expected 401, got ${NOAUTH:-curl-fail}"
                cat /tmp/packaged-health-noauth.txt || true
                exit 1
              fi
              echo "✓ unauthenticated /api/health returns 401"
              echo "----- packaged main file log -----"
              MAIN_LOG="$APP_LOG/main.log"
              if [ ! -s "$MAIN_LOG" ]; then
                echo "ERROR: packaged app did not write $MAIN_LOG"
                ls -la "$APP_LOG" || true
                find "$DATA_DIR/Library/Logs" -type f || true
                exit 1
              fi
              echo "✓ packaged main log $MAIN_LOG"
              echo "----- Host pin 421 -----"
              set +e
              FAKE_HOST=$(curl -sS -o /tmp/packaged-host-pin.txt -w "%{http_code}" \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Host: evil.example:${PORT}" \
                "http://127.0.0.1:${PORT}/api/health")
              set -e
              if [ "$FAKE_HOST" != "421" ]; then
                echo "ERROR: fake Host expected 421, got ${FAKE_HOST:-curl-fail}"
                cat /tmp/packaged-host-pin.txt || true
                exit 1
              fi
              echo "✓ fake Host header returns 421"
              echo "----- Library tab cookie: port-scoped, same-origin only -----"
              JAR="$DATA_DIR/cookies.txt"
              redact() { sed -E 's/(transcriber_local_token[_0-9]*=)[^;[:space:]]*/\1<redacted>/g' "$@"; }
              NAV_CODE=$(curl -sS -o /dev/null -D /tmp/packaged-nav.txt -c "$JAR" -w "%{http_code}" \
                -H "Sec-Fetch-Site: none" -H "Sec-Fetch-Mode: navigate" -H "Sec-Fetch-Dest: document" \
                "http://127.0.0.1:${PORT}/?layout=list&id=ci" || true)
              SET_COOKIE=$(grep -i "^set-cookie: transcriber_local_token_${PORT}=" /tmp/packaged-nav.txt || true)
              if [ "$NAV_CODE" != "200" ] || [ -z "$SET_COOKIE" ] \
                || ! grep -qi "httponly" <<<"$SET_COOKIE" || ! grep -qi "samesite=strict" <<<"$SET_COOKIE"; then
                echo "ERROR: Library navigation must mint HttpOnly SameSite=Strict transcriber_local_token_${PORT} (http=${NAV_CODE:-curl-fail})"
                redact /tmp/packaged-nav.txt || true
                exit 1
              fi
              echo "✓ Library navigation minted HttpOnly SameSite=Strict transcriber_local_token_${PORT}"
              COOKIE_VALUE=$(awk -v n="transcriber_local_token_${PORT}" '$6 == n { print $7 }' "$JAR")
              cookie_api() {
                local site="$1" want="$2" cookie="${3:-transcriber_local_token_${PORT}=${COOKIE_VALUE}}" got
                got=$(curl -sS -o /dev/null -w "%{http_code}" -b "$cookie" \
                  -H "Sec-Fetch-Site: ${site}" -H "Sec-Fetch-Mode: cors" -H "Sec-Fetch-Dest: empty" \
                  "http://127.0.0.1:${PORT}/api/transcripts" || true)
                if [ "$got" != "$want" ]; then
                  echo "ERROR: cookie GET /api/transcripts (Sec-Fetch-Site: ${site}, ${cookie%%=*}) expected $want, got ${got:-curl-fail}"
                  exit 1
                fi
                echo "✓ cookie GET /api/transcripts (Sec-Fetch-Site: ${site}, ${cookie%%=*}) -> $want"
              }
              cookie_api same-origin 200
              cookie_api same-site 401
              cookie_api cross-site 401
              cookie_api same-origin 401 "transcriber_local_token_19720=${COOKIE_VALUE}"
              cookie_api same-origin 401 "transcriber_local_token=${COOKIE_VALUE}"
              FETCH_SET=$(curl -sS -o /dev/null -D - \
                -H "Sec-Fetch-Site: cross-site" -H "Sec-Fetch-Mode: cors" -H "Sec-Fetch-Dest: empty" \
                "http://127.0.0.1:${PORT}/?layout=list&id=ci" | grep -ci '^set-cookie:' || true)
              if [ "$FETCH_SET" != "0" ]; then
                echo "ERROR: a cross-site fetch of a page must not mint the cookie"
                exit 1
              fi
              echo "✓ a cross-site fetch of a page gets no cookie"
              echo "----- pages forbid framing -----"
              expect_frame_headers() {
                local label="$1" file="$2" csp xfo
                csp=$(grep -ci '^content-security-policy:' "$file" || true)
                xfo=$(grep -ci '^x-frame-options:' "$file" || true)
                if [ "$csp" != "1" ] || [ "$xfo" != "1" ] \
                  || ! grep -i '^content-security-policy:' "$file" | grep -q "frame-ancestors 'none'" \
                  || ! grep -qiE '^x-frame-options: *DENY' "$file"; then
                  echo "ERROR: ${label} must send exactly one CSP frame-ancestors 'none' and one X-Frame-Options: DENY (csp=${csp} xfo=${xfo})"
                  redact "$file" || true
                  exit 1
                fi
              }
              for spec in "/:200" "/?layout=list&id=ci:200" "/settings:200" "/does-not-exist:404"; do
                page="${spec%%:*}"
                want="${spec##*:}"
                rm -f /tmp/packaged-frame.txt
                set +e
                CODE=$(curl -sS -o /dev/null -D /tmp/packaged-frame.txt -w "%{http_code}" \
                  "http://127.0.0.1:${PORT}${page}")
                set -e
                if [ "$CODE" != "$want" ]; then
                  echo "ERROR: ${page} expected HTTP ${want}, got ${CODE:-curl-fail}"
                  redact /tmp/packaged-frame.txt || true
                  exit 1
                fi
                expect_frame_headers "$page" /tmp/packaged-frame.txt
                echo "✓ ${page} ${CODE} sends frame-ancestors 'none' and X-Frame-Options: DENY"
              done
              rm -f /tmp/packaged-frame.txt
              set +e
              CODE=$(curl -sS -o /dev/null -D /tmp/packaged-frame.txt -w "%{http_code}" \
                "http://127.0.0.1:${PORT}/api/health")
              set -e
              if [ "$CODE" != "401" ]; then
                echo "ERROR: /api/health with no token expected 401, got ${CODE:-curl-fail}"
                redact /tmp/packaged-frame.txt || true
                exit 1
              fi
              expect_frame_headers "/api/health" /tmp/packaged-frame.txt
              echo "✓ /api/health 401 sends exactly one frame-ancestors 'none' and X-Frame-Options: DENY"
              rm -f /tmp/packaged-frame.txt
              set +e
              CODE=$(curl -sS -o /dev/null -D /tmp/packaged-frame.txt -w "%{http_code}" \
                -H "Host: evil.example:${PORT}" \
                "http://127.0.0.1:${PORT}/")
              set -e
              if [ "$CODE" != "421" ]; then
                echo "ERROR: bad Host expected 421, got ${CODE:-curl-fail}"
                redact /tmp/packaged-frame.txt || true
                exit 1
              fi
              echo "✓ bad Host header returns 421"
              echo "----- ps comm vs args for Transcriber -----"
              COMM_LINE=$(ps -axo pid=,comm= | awk -v pid="$APP_PID" '$1==pid { sub(/^[ \t]*[0-9]+[ \t]+/, ""); print }')
              ARGS_LINE=$(ps -axo pid=,args= | awk -v pid="$APP_PID" '$1==pid { sub(/^[ \t]*[0-9]+[ \t]+/, ""); print }')
              echo "ps comm= [${COMM_LINE}]"
              echo "ps args= [${ARGS_LINE}]"
              MATCH=$(bash -c 'source "$1"; pids_matching_exe "$2"' _ "electron/dmg/Install Transcriber.command" "$APP_PATH" | awk -v pid="$APP_PID" '$1==pid { print }')
              if [ -z "$MATCH" ]; then
                echo "ERROR: install-helper args match did not find PID $APP_PID at $APP_PATH"
                echo "comm was not the full executable path; helper uses args= prefix match"
                exit 1
              fi
              echo "✓ install helper args match found PID $APP_PID"
              echo "----- app vs checkout state dirs -----"
              ls -la "$APP_STATE" || true
              ls -la "$CHECKOUT_STATE" || true
              if grep -q "User data:" "$LOG"; then
                grep "User data:" "$LOG"
                grep "User data:" "$LOG" | grep -q "Transcriber App" || {
                  echo "ERROR: packaged app userData is not Transcriber App"
                  exit 1
                }
              fi
              for leaked in local-api.token extension-ids.json transcriber.db electron-secrets.json native-host-state.json native-host.json; do
                if [ -e "$CHECKOUT_STATE/$leaked" ]; then
                  echo "ERROR: packaged app wrote checkout path $leaked"
                  exit 1
                fi
              done
              if [ -d "$CHECKOUT_STATE/backups" ]; then
                echo "ERROR: packaged app created checkout backups/"
                exit 1
              fi
              CHECKOUT_LOG="$DATA_DIR/Library/Logs/Transcriber/native-host.log"
              if [ -f "$CHECKOUT_LOG" ]; then
                echo "ERROR: packaged app wrote $CHECKOUT_LOG"
                exit 1
              fi
              if [ ! -f "$APP_STATE/local-api.token" ] && [ ! -f "$APP_STATE/transcriber.db" ]; then
                echo "ERROR: packaged app did not write token or db under Transcriber App"
                find "$DATA_DIR/Library" -maxdepth 4 -type f || true
                exit 1
              fi
              echo "✓ packaged app state stayed out of checkout Transcriber/"
              echo "----- second-instance handoff -----"
              set +e
              HOME="$DATA_DIR" \
              TRANSCRIBER_LOCAL_TOKEN="$TOKEN" \
              "$APP_PATH" > "$DATA_DIR/second-instance.log" 2>&1
              SECOND_STATUS=$?
              set -e
              if ! kill -0 "$APP_PID" 2>/dev/null; then
                echo "ERROR: primary died after second launch (exit $SECOND_STATUS)"
                cat "$DATA_DIR/second-instance.log" || true
                cat "$LOG" || true
                exit 1
              fi
              echo "✓ primary still running after second launch (exit $SECOND_STATUS)"
              if ! grep -q "second-instance" "$MAIN_LOG"; then
                echo "ERROR: main.log missing second-instance event"
                cat "$MAIN_LOG" || true
                cat "$DATA_DIR/second-instance.log" || true
                exit 1
              fi
              echo "✓ file log recorded second-instance"
              break
            fi
            echo "  launch wait $i/60 (http=${HEALTH:-curl-fail})"
            if [ "$i" -eq 60 ]; then
              echo "ERROR: packaged app did not become healthy"
              echo "----- packaged app log -----"
              cat "$LOG" || true
              exit 1
            fi
            sleep 1
          done
          echo "----- packaged app log -----"
          cat "$LOG" || true
      
      - name: Test packaged app (smoke test)
        run: |
          set -euo pipefail
          ROOT="$PWD"
          APP_PATH="$ROOT/dist-electron/mac-arm64/Transcriber.app/Contents/MacOS/Transcriber"
          SQLITE_PATH="$ROOT/dist-electron/mac-arm64/Transcriber.app/Contents/Resources/app.asar.unpacked/node_modules/better-sqlite3"
          STANDALONE="$ROOT/dist-electron/mac-arm64/Transcriber.app/Contents/Resources/standalone"
          SERVER_PATH="$STANDALONE/server.js"
          BIN_DIR="$ROOT/dist-electron/mac-arm64/Transcriber.app/Contents/Resources/bin"
          
          echo "Smoke test: verify packaging..."
          
          # 1. Check Electron binary exists and is arm64
          if [ ! -f "$APP_PATH" ]; then
            echo "ERROR: Electron app binary not found at $APP_PATH"
            exit 1
          fi
          
          file "$APP_PATH" | grep -q "arm64" || {
            echo "ERROR: Electron binary is not arm64"
            file "$APP_PATH"
            exit 1
          }
          echo "✓ Electron binary exists and is arm64"
          
          # 2. Check better-sqlite3 native module was rebuilt for Electron
          if [ ! -d "$SQLITE_PATH" ]; then
            echo "ERROR: better-sqlite3 not found at $SQLITE_PATH"
            exit 1
          fi
          
          SQLITE_ADDON=$(find "$SQLITE_PATH" -name "better_sqlite3.node" | head -1)
          if [ -z "$SQLITE_ADDON" ]; then
            echo "ERROR: better-sqlite3 native addon (.node) not found"
            exit 1
          fi
          
          echo "✓ better-sqlite3 native addon exists: $SQLITE_ADDON"
          
          # 3. Test ELECTRON_RUN_AS_NODE works (simple Node script)
          echo "console.log('OK')" > /tmp/test-node.js
          OUTPUT=$(ELECTRON_RUN_AS_NODE=1 "$APP_PATH" /tmp/test-node.js 2>&1)
          if [ "$OUTPUT" != "OK" ]; then
            echo "ERROR: ELECTRON_RUN_AS_NODE test failed"
            echo "Output: $OUTPUT"
            exit 1
          fi
          echo "✓ ELECTRON_RUN_AS_NODE works"

          # 3c. Every UPDATER_MODULES entry is under unpacked, and the
          # packaged binary can require electron-updater (N4).
          UNPACKED_NM="$ROOT/dist-electron/mac-arm64/Transcriber.app/Contents/Resources/app.asar.unpacked/node_modules"
          node -e '
            const fs = require("fs");
            const path = require("path");
            const { UPDATER_MODULES } = require("./electron/after-pack.js");
            const dir = process.argv[1];
            for (const name of UPDATER_MODULES) {
              const hit = path.join(dir, name);
              if (!fs.existsSync(hit)) {
                console.error("ERROR: UPDATER_MODULES missing under unpacked:", name);
                process.exit(1);
              }
              console.log("✓ unpacked", name);
            }
            const resolved = require.resolve("electron-updater", { paths: [dir] });
            console.log("✓ require.resolve electron-updater ->", resolved);
          ' "$UNPACKED_NM"
          python3 -c 'import json,sys; print("require(require.resolve(%s,{paths:[%s]})); console.log(\"OK\");" % (json.dumps("electron-updater"), json.dumps(sys.argv[1])))' "$UNPACKED_NM" > /tmp/require-updater.js
          set +e
          UPDATER_OUT=$(ELECTRON_RUN_AS_NODE=1 "$APP_PATH" /tmp/require-updater.js 2>&1)
          UPDATER_STATUS=$?
          set -e
          if [ "$UPDATER_STATUS" -ne 0 ] || [ "$UPDATER_OUT" != "OK" ]; then
            echo "ERROR: packaged require of electron-updater failed (status=$UPDATER_STATUS)"
            echo "Output: $UPDATER_OUT"
            exit 1
          fi
          echo "✓ ELECTRON_RUN_AS_NODE require(electron-updater) from packaged binary"

          # 3b. Native-host wrapper target exists under app.asar.unpacked, then ping it
          RESOURCES="$ROOT/dist-electron/mac-arm64/Transcriber.app/Contents/Resources"
          HOST_JS="$RESOURCES/app.asar.unpacked/tools/native-host/transcriber-host.js"
          echo "----- native host wrapper target -----"
          ls -la "$HOST_JS"
          if [ ! -f "$HOST_JS" ]; then
            echo "ERROR: wrapper target missing: $HOST_JS"
            echo "----- Resources listing -----"
            ls -la "$RESOURCES" || true
            find "$RESOURCES" -name 'transcriber-host.js' || true
            exit 1
          fi
          echo "✓ native host script exists at wrapper target"

          WRAPPER=/tmp/transcriber-host.sh
          NMH_HOME="$(mktemp -d /tmp/transcriber-nmh-XXXXXX)"
          NMH_PORT=$(node -p "require('./electron/config.js').port")
          NMH_APP_STATE=$(HOME="$NMH_HOME" node -p "require('./electron/config.js').resolveAppStateDir()")
          NMH_APP_LOG=$(HOME="$NMH_HOME" node -p "require('./electron/config.js').resolveAppLogDir()")
          NMH_CHECKOUT_STATE=$(HOME="$NMH_HOME" node -p "require('./electron/config.js').resolveCheckoutStateDir()")
          printf '#!/bin/sh\nexport ELECTRON_RUN_AS_NODE=1\nexport PORT=%s\nexport TRANSCRIBER_STATE_DIR=%s\nexport TRANSCRIBER_LOG_DIR=%s\nexec "%s" "%s" "$@"\n' \
            "'${NMH_PORT}'" \
            "'${NMH_APP_STATE}'" \
            "'${NMH_APP_LOG}'" \
            "$APP_PATH" \
            "$HOST_JS" > "$WRAPPER"
          chmod +x "$WRAPPER"

          echo "----- native-host ping -----"
          python3 - <<'PY' | HOME="$NMH_HOME" "$WRAPPER" > /tmp/nmh-pong.bin
          import sys, struct, json
          payload = json.dumps({"id": "ci-ping", "cmd": "ping"}).encode("utf-8")
          sys.stdout.buffer.write(struct.pack("<I", len(payload)))
          sys.stdout.buffer.write(payload)
          sys.stdout.buffer.flush()
          PY
          python3 - <<'PY'
          import json, struct, sys
          data = open("/tmp/nmh-pong.bin", "rb").read()
          print("native-host ping raw bytes:", len(data))
          if len(data) < 4:
              print("ERROR: native host produced no framed reply", file=sys.stderr)
              sys.exit(1)
          n = struct.unpack_from("<I", data, 0)[0]
          msg = json.loads(data[4:4 + n])
          print("native-host ping reply:", json.dumps(msg, sort_keys=True))
          if msg.get("id") != "ci-ping" or not msg.get("ok") or not msg.get("pong"):
              print("ERROR: unexpected ping reply", file=sys.stderr)
              sys.exit(1)
          if msg.get("protocol") != 2 or msg.get("target") != "app" or "getLocalToken" not in msg.get("commands", []):
              print("ERROR: packaged host must report protocol 2, target app, and its commands", file=sys.stderr)
              sys.exit(1)
          print("✓ native host ping (protocol 2)")
          PY

          echo "----- native-host app Start allowlist -----"
          cat > /tmp/ci-app-start.js <<'JS'
          const host = require(process.argv[2]);
          const exe = process.argv[3];
          const bundle = require("path").resolve(exe, "..", "..", "..");
          const r = host.resolveStartLaunch({ ELECTRON_RUN_AS_NODE: "1" }, exe);
          console.log(JSON.stringify(r));
          if (!r.ok || r.bundle !== bundle) throw new Error("packaged bundle is not in the Start allowlist");
          const expected = ["-a", bundle, "--args", "--launched-by=native-host"];
          if (r.launch.command !== "/usr/bin/open" || JSON.stringify(r.launch.args) !== JSON.stringify(expected)) {
            throw new Error("app Start must be /usr/bin/open -a <bundle> --args --launched-by=native-host");
          }
          JS
          ELECTRON_RUN_AS_NODE=1 "$APP_PATH" /tmp/ci-app-start.js "$HOST_JS" "$APP_PATH"
          echo "✓ app Start resolves the packaged bundle with open -a and the native-host launch flag"

          echo "----- native-host getLocalToken -----"
          PAIR_ID="abcdefghijklmnopabcdefghijklmnop"
          mkdir -p "$NMH_APP_STATE" "$NMH_CHECKOUT_STATE"
          printf '["%s"]\n' "$PAIR_ID" > "$NMH_APP_STATE/extension-ids.json"
          EXPECTED_TOKEN="$(python3 -c 'print("ab" * 32)')"
          printf '%s' "$EXPECTED_TOKEN" > "$NMH_APP_STATE/local-api.token"
          chmod 600 "$NMH_APP_STATE/local-api.token"
          printf '[]\n' > "$NMH_CHECKOUT_STATE/extension-ids.json"
          printf '%s' "$(python3 -c 'print("cd" * 32)')" > "$NMH_CHECKOUT_STATE/local-api.token"
          chmod 600 "$NMH_CHECKOUT_STATE/local-api.token"
          python3 - <<'PY' | HOME="$NMH_HOME" "$WRAPPER" "chrome-extension://${PAIR_ID}/" > /tmp/nmh-token.bin
          import sys, struct, json
          payload = json.dumps({"id": "ci-token", "cmd": "getLocalToken"}).encode("utf-8")
          sys.stdout.buffer.write(struct.pack("<I", len(payload)))
          sys.stdout.buffer.write(payload)
          sys.stdout.buffer.flush()
          PY
          python3 - <<PY
          import json, struct, sys
          expected = "${EXPECTED_TOKEN}"
          data = open("/tmp/nmh-token.bin", "rb").read()
          print("native-host getLocalToken raw bytes:", len(data))
          if len(data) < 4:
              print("ERROR: native host produced no framed getLocalToken reply", file=sys.stderr)
              sys.exit(1)
          n = struct.unpack_from("<I", data, 0)[0]
          msg = json.loads(data[4:4 + n])
          print("native-host getLocalToken reply keys:", sorted(msg.keys()))
          if msg.get("id") != "ci-token" or msg.get("ok") is not True:
              print("ERROR: unexpected getLocalToken reply", json.dumps(msg, sort_keys=True), file=sys.stderr)
              sys.exit(1)
          if msg.get("token") != expected:
              print("ERROR: getLocalToken returned the wrong token", file=sys.stderr)
              sys.exit(1)
          print("✓ native host getLocalToken ok:true")
          PY
          
          # 4. Check bundled binaries exist, are arm64, and are not Homebrew-linked
          for binary in ffmpeg yt-dlp; do
            if [ ! -f "$BIN_DIR/$binary" ]; then
              echo "ERROR: $binary not found in $BIN_DIR"
              exit 1
            fi
