            set -e
            if [ "$CURL_OK" -eq 0 ]; then
              HEALTH_CODE=$(printf '%s' "$HEALTH_BODY" | tail -n 1)
              HEALTH_JSON=$(printf '%s' "$HEALTH_BODY" | sed '$d')
              if [ "$HEALTH_CODE" = "200" ]; then
                echo "✓ Health endpoint returned 200 on attempt $i"
                echo "----- health body -----"
                echo "$HEALTH_JSON"
