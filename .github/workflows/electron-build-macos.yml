name: Build Electron macOS DMG

on:
  workflow_dispatch:
  push:
    branches:
      - beta/electron-menubar

jobs:
  build:
    name: Build macOS DMG (arm64)
    runs-on: macos-14  # macOS arm64 runner
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build Next.js
        run: npm run build
      
      - name: Download ffmpeg (arm64)
        run: |
          mkdir -p electron/resources/bin
          # Install ffmpeg via Homebrew (guarantees correct architecture)
          brew install ffmpeg
          # Copy the binary to our resources
          cp "$(which ffmpeg)" electron/resources/bin/ffmpeg
          chmod +x electron/resources/bin/ffmpeg
          
          # Verify architecture (must be arm64)
          file electron/resources/bin/ffmpeg | tee /dev/stderr | grep -q "arm64" || {
            echo "ERROR: ffmpeg is not arm64!"
            lipo -info electron/resources/bin/ffmpeg || true
            file electron/resources/bin/ffmpeg
            exit 1
          }
          echo "✓ ffmpeg architecture verified: arm64"
      
      - name: Download yt-dlp
        run: |
          mkdir -p electron/resources/bin
          curl -L -o electron/resources/bin/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos
          chmod +x electron/resources/bin/yt-dlp
      
      - name: Build Electron app
        run: npm run electron:build
        env:
          # Don't sign - we're doing ad-hoc signing only
          CSC_IDENTITY_AUTO_DISCOVERY: false
      
      - name: Test packaged app (smoke test)
        run: |
          set -e
          APP_PATH="dist-electron/mac-arm64/Transcriber.app/Contents/MacOS/Transcriber"
          SERVER_PATH="dist-electron/mac-arm64/Transcriber.app/Contents/Resources/app.asar.unpacked/.next/standalone/server.js"
          
          echo "Testing Electron binary with ELECTRON_RUN_AS_NODE=1..."
          
          # Create temp database
          export DATABASE_URL="file:/tmp/test-transcriber.db"
          export TRANSCRIBER_LOCAL_TOKEN="test-token-$(date +%s)"
          
          # Run server via Electron's Node with ELECTRON_RUN_AS_NODE=1
          ELECTRON_RUN_AS_NODE=1 "$APP_PATH" "$SERVER_PATH" -p 19721 --hostname 127.0.0.1 &
          SERVER_PID=$!
          
          echo "Server started (PID: $SERVER_PID), waiting for health check..."
          
          # Wait for server to be ready
          for i in {1..30}; do
            if curl -f http://127.0.0.1:19721/api/health 2>/dev/null; then
              echo "✓ Server responded successfully!"
              kill $SERVER_PID 2>/dev/null || true
              exit 0
            fi
            echo "  Attempt $i/30..."
            sleep 1
          done
          
          echo "ERROR: Server failed to respond"
          kill $SERVER_PID 2>/dev/null || true
          exit 1
      
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Transcriber-macOS-arm64
          path: dist-electron/*.dmg
          retention-days: 30
      
      - name: Upload build info
        run: |
          echo "Build completed at $(date)" > dist-electron/build-info.txt
          echo "Branch: ${{ github.ref_name }}" >> dist-electron/build-info.txt
          echo "Commit: ${{ github.sha }}" >> dist-electron/build-info.txt
      
      - name: Upload build info artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: dist-electron/build-info.txt
          retention-days: 30
