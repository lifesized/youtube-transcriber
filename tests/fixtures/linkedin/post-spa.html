<!DOCTYPE html>
<!-- Single LinkedIn post reached by in-app navigation: no page data, a
     MediaSource (blob:) player, and no data-urn container. The post is found
     through its own timestamp link; media comes from the tab's network entries. -->
<html>
<head><title>Post | LinkedIn</title></head>
<body>
  <main>
    <article>
      <div class="post-header">
        <span class="update-components-actor__name">Raj Patel</span>
        <a href="https://www.linkedin.com/feed/update/urn:li:activity:7299999999999999999/">3d</a>
      </div>
      <div class="update-components-text">A five minute tour of our offline sync engine.</div>
      <div class="player" data-fixture-top="150">
        <video src="blob:https://www.linkedin.com/abcd-spa"></video>
      </div>
    </article>
  </main>
</body>
</html>
