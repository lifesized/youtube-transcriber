# Slack App Manifest for "Tusk".
# Create the app at https://api.slack.com/apps → From an app manifest.
# Socket Mode only: no Request URL, no OAuth redirect, no tunnel.
# Schema reference: https://api.slack.com/reference/manifests

display_information:
  name: Tusk
  description: Local Slack bot in Transcriber. Paste a supported link for 👀; /tusk help and status.
  background_color: "#0a0a0a"
  long_description: >
    Tusk is a Socket Mode Slack bot that runs locally inside the Transcriber
    menu-bar app on your Mac. No public URL, tunnel, or cloud worker.
    Milestone 1: invite @Tusk to a public channel, paste a YouTube, Spotify
    episode, or LinkedIn URL, and Tusk adds 👀. /tusk help and /tusk status
    report whether the Mac app is connected. Threaded summaries and @Tusk
    questions are not in this build. channels:history delivers every message
    in public channels Tusk has joined; Tusk ignores DMs, private channels,
    other workspaces, and Slack Connect externals.

features:
  bot_user:
    display_name: Tusk
    always_online: true
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: false
    messages_tab_read_only_enabled: true
  slash_commands:
    - command: /tusk
      description: Show Tusk help or whether the Mac app is connected
      usage_hint: "[help|status]"
      should_escape: false

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - chat:write
      - commands
      - files:write
      - reactions:write

settings:
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
  interactivity:
    is_enabled: false
