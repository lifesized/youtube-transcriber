# Slack App Manifest for "Tusk".
# Create the app at https://api.slack.com/apps → From an app manifest.
# Socket Mode only: no Request URL, no OAuth redirect, no tunnel.
# Schema reference: https://api.slack.com/reference/manifests

display_information:
  name: Tusk
  description: Drop a YouTube link, get an instant work-grade summary in thread.
  background_color: "#0a0a0a"
  long_description: >
    Tusk turns any YouTube link posted in Slack into a concise,
    action-oriented summary delivered in thread. Mention @Tusk on a
    message containing a YouTube URL and the bot replies with the key points,
    decisions, and action items distilled from the video. Built for engineering,
    sales, support, and leadership teams that need to triage long-form video
    without watching it end-to-end. Tusk runs locally inside the Transcriber
    menu-bar app on your Mac using Slack Socket Mode — no public URL, tunnel,
    or cloud worker.

features:
  bot_user:
    display_name: Tusk
    always_online: true
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: false
    messages_tab_read_only_enabled: true
  slash_commands:
    - command: /tusk
      description: Show Tusk help or whether the Mac app is connected
      usage_hint: "[help|status]"
      should_escape: false

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - chat:write
      - commands
      - files:write
      - reactions:write

settings:
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
  interactivity:
    is_enabled: false
